<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts not in the substitution table fall back to Noto Sans CJK KR. -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK KR</string></edit>
  </match>
</fontconfig>
